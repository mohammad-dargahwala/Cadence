<!doctype html>
<html lang="en" data-motion="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadence · Living themes</title>
<link rel="stylesheet" href="/experience.css">
<style>
body{margin:0;background:#10121a;color:#f4f0ed;font:14px/1.5 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:32px 24px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}h1{font-size:28px;font-weight:500;letter-spacing:-.04em;margin:0 0 5px}.subtitle{color:#aca9b4;margin:0}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{background:#232530;color:#eee9ef;border:1px solid #ffffff24;border-radius:9px;padding:10px 13px;font:inherit}a{color:#d8c4e9}.timer-toggle{font-size:12px;color:#c5bfca;display:flex;gap:6px;align-items:center}.scene-only .timer-face{visibility:hidden}.worlds{display:grid;grid-template-columns:1fr 1fr;gap:20px}.world{border:1px solid #ffffff21;border-radius:24px;overflow:hidden;background:#171a23}.stage{position:relative;height:360px;display:grid;place-items:center;isolation:isolate;overflow:hidden}.landscape{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.world .timer-face{position:relative;width:230px!important;height:230px!important;overflow:hidden;border:1px solid #fff4;border-radius:50%}.timer-art{position:absolute;inset:0;width:100%;height:100%}.timer-ink{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}.world .timer-numerals{font-size:52px!important;color:#f4f1ef}.timer-mode{font-size:9px;letter-spacing:.23em;color:#ffffff99}.timer-status{font-size:11px;color:#ffffffaa}.caption{padding:18px 21px}.caption h2{font-size:16px;font-weight:500;margin:0 0 5px}.caption p{font-size:12px;color:#aaa8b7;margin:0}.progress{display:flex;align-items:center;gap:16px;padding-top:24px;color:#aaa8b7}.progress input{max-width:300px;flex:1;accent-color:#ceb1dc}.footer{font-size:11px;color:#777889;margin-top:22px}@media(max-width:720px){header{align-items:flex-start;flex-direction:column}.worlds{grid-template-columns:1fr}.stage{height:350px}}
</style><script src="/art-worlds.js" defer></script><script src="/flow-engine.js" defer></script><script src="/atmospheres.js" defer></script></head><body><main>
<header><div><h1>Nine worlds. Always becoming.</h1><p class="subtitle">Living scenes and a timer that belongs to each one.</p></div><div class="controls"><button id="motion">Pause motion</button><select id="pace" aria-label="Flow pace"><option value="0.55">Gentle</option><option value="1" selected>Fluid</option><option value="1.65">Expressive</option></select><label class="timer-toggle"><input type="checkbox" id="show-timer" checked> Show timer</label><a href="/">Back to Cadence</a></div></header>
<div class="worlds"></div><label class="progress">Countdown progress<input id="progress" type="range" min="0" max="100" value="65"><span id="progress-label">65%</span></label><p class="footer">Pause the motion at any time. In Cadence, Follow system reduced motion is available in Settings. This gallery has no music connection.</p>
</main><script>
addEventListener('DOMContentLoaded',()=>{
  const container=document.querySelector('.worlds');
  for(const [id,theme] of Object.entries(CadenceWorlds.themes)){
    const article=document.createElement('article');article.className='world';article.dataset.theme=id;
    article.innerHTML='<div class="stage"><canvas class="landscape" aria-hidden="true"></canvas><div class="timer-face"><canvas class="timer-art" aria-hidden="true"></canvas><div class="timer-ink"><span class="timer-mode">FOCUS</span><span class="timer-numerals">16:15</span><span class="timer-status"></span></div></div></div><div class="caption"><h2></h2><p></p></div>';
    article.querySelector('h2').textContent=theme.name;article.querySelector('.caption p').textContent=theme.description;article.querySelector('.timer-status').textContent=theme.status;container.append(article);
  }
  const visible=new Set();const observer=new IntersectionObserver(entries=>entries.forEach(e=>e.isIntersecting?visible.add(e.target):visible.delete(e.target)),{rootMargin:'150px'});container.querySelectorAll('.world').forEach(el=>observer.observe(el));
  document.getElementById('show-timer').onchange=e=>container.classList.toggle('scene-only',!e.target.checked);
  const worlds=Array.from(document.querySelectorAll('.world'));let moving=true;const clock=CadenceFlow.createClock();
  const button=document.getElementById('motion'),pace=document.getElementById('pace'),progress=document.getElementById('progress');
  function label(){button.textContent=moving?'Pause motion':'Resume motion';document.documentElement.dataset.motion=String(moving);}label();
  button.onclick=()=>{moving=!moving;label();};
  function frame(now){requestAnimationFrame(frame);const t=clock.sample(now,moving&&!document.hidden,Number(pace.value));if(document.hidden)return;
    const f=Number(progress.value)/100,sec=Math.round(1500*f),text=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');document.getElementById('progress-label').textContent=progress.value+'%';
    for(const world of worlds){if(!visible.has(world))continue;const stage=world.querySelector('.stage'),bg=world.querySelector('.landscape'),dial=world.querySelector('.timer-art'),w=stage.clientWidth,h=stage.clientHeight;
      if(bg.width!==w||bg.height!==h){bg.width=w;bg.height=h;}if(dial.width!==230){dial.width=230;dial.height=230;}
      CadenceAtmospheres.draw(bg.getContext('2d'),w,h,t,world.dataset.theme);CadenceAtmospheres.drawTimer(dial.getContext('2d'),230,230,t,world.dataset.theme,f);world.querySelector('.timer-numerals').textContent=text;
    }
  }requestAnimationFrame(frame);
});
</script></body></html>
